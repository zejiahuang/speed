# Single source of truth for plugin and library versions.
#
# The Compose BOM decides the versions of the `androidx.compose.*` artifacts that
# carry no `version.ref` below. Modules pinned on purpose — because the BOM does
# not manage them, or because a specific release is required — carry an explicit
# version.

[versions]
agp = "9.5.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
material3 = "1.5.0-rc01"
materialIcons = "1.7.8"
backdrop = "2.0.1"
markdownRenderer = "0.46.0"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Versionless: the Compose BOM above supplies these.
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

# `wsc` is short for window-size-class: the literal alias would generate an
# accessor ending in `class`, which is a Kotlin keyword.
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
material3-wsc = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3" }
material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIcons" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 has built-in Kotlin, so `org.jetbrains.kotlin.android` is no longer
# applied. The Compose compiler plugin is still required and still tracks Kotlin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
