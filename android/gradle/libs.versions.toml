# Single source of truth for plugin and library versions.
#
# The Compose BOM still decides the versions of the `androidx.compose.*` artifacts
# that carry no `version.ref` below. Only modules whose version is deliberately
# chosen (or pinned by a compileSdk ceiling) appear with an explicit version.

[versions]
agp = "8.13.2"
kotlin = "2.4.20"
composeBom = "2025.12.01"
coreKtx = "1.15.0"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
navigation = "2.8.5"
material3 = "1.5.0-alpha18"
materialIcons = "1.7.8"
backdrop = "1.0.6"
markdownRenderer = "0.41.0"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Versionless: the Compose BOM above supplies these.
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

# `wsc` is short for window-size-class: the literal alias would generate an
# accessor ending in `class`, which is a Kotlin keyword.
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
material3-wsc = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3" }
material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIcons" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
