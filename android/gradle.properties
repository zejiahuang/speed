# Gradle needs room: the Compose toolchain plus the Android plugin is a large
# dependency graph, and the default 512m heap fails on a cold build.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Compose compiles a lot of small files; parallel and cached builds are worth
# having on.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
